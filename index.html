<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCBC SmartOps Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

        <h1>OCBC SmartOps AI</h1>
        <p>Intelligent Operations Dashboard </p>
    </header>

    <main>

        <div class="cards">

                <h3>Total Exceptions</h3>
                <p>25</p>
            </div>

            <div class="card">

                <p>10</p>
            </div>

            <div class="card">
                <h3>Resolved Cases</h3>
                <p>12</p>
            </div>

            <div class="card">
                <h3>Escalted Cases</h3>
                <p>3</p>
            </div>
        </div>



    </main>

</html>
